[browser]
# Privacy: never send usage statistics
gatherUsageStats = false

[server]
maxUploadSize = 500
headless = true
address = "localhost"
fileWatcherType = "none"

[client]
toolbarMode = "minimal"
showErrorDetails = "stacktrace"

[runner]
magicEnabled = false

[theme]
base = "dark"
primaryColor = "#3987E5"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111827"
textColor = "#E5E7EB"
font = "sans serif"
